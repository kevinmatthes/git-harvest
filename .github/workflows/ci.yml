name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  cargo:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - name: checkout w/ tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: cargo ${{ matrix.subcommand }}
    strategy:
      matrix:
        subcommand:
          - build
          - clippy --all-targets
          - doc --no-deps
          - test

  cffconvert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker://citationcff/cffconvert:2.0.0
        with:
          args: --validate -i CITATION.cff

  renovate-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: |
          npx -p renovate \
              -c 'renovate-config-validator renovate.json --strict' \
              -y

  formatting:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: cargo fmt --check

  release-level:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - name: checkout w/ tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: taiki-e/install-action@v2.87.4
        with:
          tool: cargo-semver-checks@0.50.0

      - run: |
          set -euo pipefail

          LAST="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$LAST" ]; then
            echo "no baseline tag yet; nothing to measure against"
            exit 0
          fi
          BASE="${LAST#v}"
          echo "the baseline is $LAST"

          level='patch'
          raise() {
            case "$1" in
              major) level='major' ;;
              minor) [ "$level" = major ] || level='minor' ;;
            esac
          }

          echo "::group::cargo-semver-checks"
          report="$(cargo semver-checks --baseline-rev "$LAST" \
                    --release-type patch 2>&1 || true)"
          echo "$report"
          echo "::endgroup::"

          case "$report" in
            *'requires new major version'*) raise major ;;
            *'requires new minor version'*) raise minor ;;
            *'no semver update required'*) ;;
            *) echo 'no verdict from cargo-semver-checks'; exit 1 ;;
          esac

          OLD_MSRV="$(git show "$LAST:Cargo.toml" |
                      awk -F'"' '/^rust-version = / { print $2; exit }')"
          NEW_MSRV="$(awk -F'"' '/^rust-version = / { print $2; exit }' \
                      Cargo.toml)"
          if [ "$OLD_MSRV" != "$NEW_MSRV" ] &&
             [ "$(printf '%s\n%s\n' "$OLD_MSRV" "$NEW_MSRV" |
                  sort -V | tail -1)" = "$NEW_MSRV" ]
          then
            echo "the minimum toolchain rose $OLD_MSRV -> $NEW_MSRV"
            raise minor
          fi

          depmajor() {
            grep -E "^$1 = " | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' |
              head -1 | cut -d. -f1
          }

          for dep in chrono clap list-my-licence semver sysexits; do
            old="$(git show "$LAST:Cargo.toml" | depmajor "$dep" || true)"
            new="$(depmajor "$dep" < Cargo.toml || true)"
            if [ -n "$old" ] && [ -n "$new" ] && [ "$new" -gt "$old" ]
            then
              echo "$dep is required at $new, was $old"
              raise major
            fi
          done

          IFS=. read -r MAJ MIN PAT <<< "$BASE"
          if [ "$MAJ" -eq 0 ]; then
            case "$level" in
              major) EXPECTED="0.$((MIN + 1)).0" ;;
              *) EXPECTED="0.$MIN.$((PAT + 1))" ;;
            esac
          else
            case "$level" in
              major) EXPECTED="$((MAJ + 1)).0.0" ;;
              minor) EXPECTED="$MAJ.$((MIN + 1)).0" ;;
              *) EXPECTED="$MAJ.$MIN.$((PAT + 1))" ;;
            esac
          fi

          ACTUAL="$(awk -F'"' '/^\[/ { s = $0 }
                    s == "[package]" && /^version = / {
                      print $2; exit
                    }' Cargo.toml)"
          echo "$LAST plus a $level step is $EXPECTED;"
          echo "the manifest says $ACTUAL"

          if [ "$ACTUAL" = "$EXPECTED" ] || [ "$ACTUAL" = 1.0.0 ]; then
            exit 0
          fi

          echo "this change asks for a $level release over $BASE, so the"
          echo "manifest must read $EXPECTED, not $ACTUAL:  set the"
          echo "package version in Cargo.toml, the git-harvest entry in"
          echo "Cargo.lock and the version of CITATION.cff to $EXPECTED"
          exit 1

  changelog-fragment:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        run: rustup update

      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        name: a Bucket ::= commit is matched by a committed fragment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          harvested=no
          while IFS= read -r subject; do
            case "$subject" in
              'Added ::= '* | 'Changed ::= '* | 'Deprecated ::= '* | \
              'Fixed ::= '* | 'Removed ::= '* | 'Security ::= '*)
                harvested=yes ;;
            esac
          done < <(git log --format='%s' "$BASE..$HEAD")

          added=$(git diff --diff-filter=A --name-only "$BASE...$HEAD" \
                  -- changelog.d/)

          if [ "$harvested" = yes ] && [ -z "$added" ]; then
            echo "::error::a 'Bucket ::= ' commit on this branch adds no"
            echo "changelog.d/ fragment.  Run 'git harvest scan' and commit"
            echo "the result before merging."
            exit 1
          fi

          scan_dir="$RUNNER_TEMP/harvest"
          cargo run --locked --quiet -- scan --base "$BASE" \
            --output "$scan_dir"

          fresh=("$scan_dir"/*.ron)
          if [ ${#fresh[@]} -eq 0 ]; then
            echo "nothing to harvest; the fragment check passes"
            exit 0
          fi

          normalise() { sed -E 's/Some\("[0-9a-f]+"\)/Some(HASH)/g' "$1"; }
          want=$(normalise "${fresh[0]}")

          for committed in changelog.d/*.ron; do
            if [ "$(normalise "$committed")" = "$want" ]; then
              echo "a committed fragment matches a fresh scan of this branch"
              exit 0
            fi
          done

          echo "::error::'git harvest scan' finds entries that no committed"
          echo "changelog.d/ fragment carries -- the fragment is missing or"
          echo "stale.  Re-run 'git harvest scan' and commit it."
          echo '--- a fresh scan of this branch ---'
          cat "${fresh[0]}"
          exit 1

  harvest-renovate:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: fregante/setup-git-user@v2.0.2

      - name: record the dependency bump as a freely authored fragment
        env:
          BASE: ${{ github.base_ref }}
          LEAF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          marker="Skip ::= record the dependency bump"
          if git log --format='%s' "origin/$BASE..HEAD" |
             grep -qxF "$marker"
          then
            echo "the fragment is already recorded"
            exit 0
          fi

          entry=$(printf '%s' "$TITLE" | sed -E 's/^\[Renovate\] +//')
          entry=$(printf '%s' "$entry" | sed -E 's/(["\\])/\\\1/g')
          head=$(printf '%s' "$entry" | cut -c1 | tr '[:upper:]' '[:lower:]')
          rest=$(printf '%s' "$entry" | cut -c2-)
          leaf=${LEAF##*/}
          stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          file="changelog.d/${stamp}_${leaf}.ron"

          mkdir -p changelog.d
          {
            printf '(\n  references: {},\n  changes: {\n'
            printf '    "Changed": [\n'
            printf '      (text: "%s%s", commit: None),\n' "$head" "$rest"
            printf '    ],\n  },\n)\n'
          } > "$file"

          git add "$file"
          git commit -m "$marker"
          git push

  gate:
    needs:
      - actionlint
      - cargo
      - changelog-fragment
      - cffconvert
      - formatting
      - release-level
      - renovate-linter
    runs-on: ubuntu-latest
    steps:
      - run: bash -c 'exit 0'

################################################################################
