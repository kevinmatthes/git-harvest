name: fragment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fragment:
    if: github.repository == 'kevinmatthes/git-harvest'
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2.0.2

      - name: harvest this branch into a changelog fragment
        run: |
          cargo run --locked --quiet -- scan --base origin/main
          [ -d changelog.d ] || { echo 'nothing to harvest'; exit 0; }
          git add changelog.d/
          git diff --cached --quiet && { echo 'nothing new'; exit 0; }
          git commit -m 'Skip ::= record this branch as a fragment'
          git push

################################################################################
