################################################################################

name: pr-title

on:
  pull_request:

permissions:
  contents: read

jobs:
  category:
    runs-on: ubuntu-latest
    steps:
      - name: reject an unknown category
        if: >-
          !contains(github.event.pull_request.title, '[Renovate] ')
          && !contains(github.event.pull_request.title, '[GitHub Actions] ')
          && !contains(github.event.pull_request.title, '[Bugfix] ')
          && !contains(github.event.pull_request.title, '[Documentation] ')
          && !contains(github.event.pull_request.title, '[Enhancement] ')
        run: |
          echo '::error::title must open with a known category'
          exit 1

################################################################################
