name: release

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  decide:
    if: github.repository == 'kevinmatthes/git-harvest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: checkout w/ tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: anything shipped since the last tag?
        id: check
        run: |
          set -euo pipefail

          blank_version() {
            case "$1" in
              Cargo.toml)
                awk '/^\[/ { s = $0 }
                     s == "[package]" && /^version = / { print "V"; next }
                     { print }'
                ;;
              Cargo.lock)
                awk '/^name = "git-harvest"$/ { seen = 1 }
                     seen && /^version = / { print "V"; seen = 0; next }
                     { print }'
                ;;
              *) cat ;;
            esac
          }

          last=$(git describe --tags --abbrev=0)
          version=$(cargo metadata --format-version 1 --no-deps |
                    jq -r '.packages[0].version')

          shipped=no
          for f in $(git diff --name-only "$last"..HEAD); do
            case "$f" in
              src/*|README.md|LICENCE|Cargo.toml|Cargo.lock) ;;
              *) continue ;;
            esac
            a=$(git show "$last:$f" 2>/dev/null | blank_version "$f" || true)
            b=$(git show "HEAD:$f" 2>/dev/null | blank_version "$f" || true)
            [ "$a" = "$b" ] || { shipped=yes; break; }
          done

          release=no
          if [ "$shipped" = yes ] &&
             [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]
          then
            release=yes
          fi

          echo "last=$last version=$version shipped=$shipped -> $release"
          {
            echo "release=$release"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: decide
    if: needs.decide.outputs.release == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - run: rustup update

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: assemble this version's notes from the CHANGELOG
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail

          cargo run --locked --quiet -- assemble "$VERSION"
          cargo run --locked --quiet -- render -o rendered.md

          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\] " { grab = 1; print; next }
            grab && /^## \[/ { grab = 0 }
            grab { print }
            /^\[[^]]+\]: / { print }
          ' rendered.md > release-notes.md

          echo "::group::release-notes.md"
          cat release-notes.md
          echo "::endgroup::"

      - uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
          tag_name: v${{ needs.decide.outputs.version }}

      - id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  bookkeep:
    needs: [decide, release]
    if: needs.decide.outputs.release == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - run: rustup update

      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - uses: fregante/setup-git-user@v2.0.2

      - name: open the next-patch pull request
        run: |
          set -euo pipefail

          next=$(echo "$VERSION" |
                 awk -F. '{ printf "%s.%s.%d", $1, $2, $3 + 1 }')
          branch="github-actions/post-v$VERSION"
          commit="Skip ::= pre-bump the manifest to $next"
          title="[GitHub Actions] Release:  bump to $next"

          cargo run --locked -- assemble "$VERSION"

          awk -v v="$next" '/^\[/ { s = $0 }
               s == "[package]" && /^version = / {
                 print "version = \"" v "\""; next
               }
               { print }' Cargo.toml > Cargo.toml.next
          mv Cargo.toml.next Cargo.toml

          awk -v v="$next" '/^name = "git-harvest"$/ { seen = 1 }
               seen && /^version = / {
                 print "version = \"" v "\""; seen = 0; next
               }
               { print }' Cargo.lock > Cargo.lock.next
          mv Cargo.lock.next Cargo.lock

          env -u CI cargo check --locked

          today=$(date -u +%F)
          sed -i -E "s/^version: .+/version: $VERSION/" CITATION.cff
          sed -i -E "s/^date-released: .+/date-released: $today/" CITATION.cff

          git switch -c "$branch"
          git add -A
          git commit -m "$commit"
          git push -u origin "$branch"

          body="v$VERSION is published, so the manifest moves on to $next."
          body="$body  The assembled CHANGELOG.ron section, the consumed"
          body="$body  changelog.d/ fragments and the refreshed THIRDPARTY.md"
          body="$body  ride along.  Raise the version further before merging if"
          body="$body  a larger change has already landed; release-level says."

          gh pr create --base main --head "$branch" \
             --title "$title" --body "$body"

################################################################################
