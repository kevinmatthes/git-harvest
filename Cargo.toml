[workspace]
exclude = ["target"]
members = ["xtask"]

[workspace.metadata.release]
publish = false
tag = false
push = false
pre-release-commit-message = "Skip ::= pre-bump the manifest to {{version}}"

[package]
name = "git-harvest"
version = "0.4.1"
edition = "2024"
rust-version = "1.98.1"
description = "Harvest a CHANGELOG from your Git history."
repository = "https://github.com/kevinmatthes/git-harvest"
license = "GPL-3.0-or-later"
authors = ["Kevin Matthes <aeruginous.rs@gmail.com>"]
keywords = ["changelog", "git", "keep-a-changelog", "release", "ron"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = [
    "build.rs",
    "src/**",
    "README.md",
    "LICENCE",
    "THIRDPARTY.md",
    "debian/copyright",
    "licences/musl/COPYRIGHT",
]

[package.metadata.release]
publish = false
tag = false
push = false
shared-version = true
pre-release-hook = ["env", "-u", "CI", "cargo", "run", "-p", "xtask"]
pre-release-commit-message = "Skip ::= pre-bump the manifest to {{version}}"

[package.metadata.deb]
depends = []
extended-description = """\
`git-harvest` produces a Keep a Changelog-style CHANGELOG from a Git \
repository's commit history:  it harvests structured commit subjects on \
a branch into fragments, assembles the fragments into released \
sections, renders the released history as Markdown, maintains a \
contributor registry, and reproduces the licence notices of every \
dependency it ships."""
assets = [
    ["target/release/git-harvest", "usr/bin/", "755"],
    ["debian/copyright", "usr/share/doc/git-harvest/copyright", "644"],
    ["man/*.1", "usr/share/man/man1/", "644"],
    ["SOURCE.txt", "usr/share/doc/git-harvest/", "644"],
]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
gix = "0.87.1"
indexmap = { version = "2.14.2", features = ["serde"] }
list-my-licence = { version = "0.3.2", features = ["clap"] }
ron = "0.12.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
sysexits = "0.13.0"

[build-dependencies]
list-my-licence = { version = "0.3.2", features = ["build"] }

[dev-dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
sysexits = "0.13.0"
tempfile = "3.27.0"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

[lints.rust]
dead_code = "deny"
deprecated = "deny"
missing_docs = "deny"
unreachable_code = "deny"
unused_assignments = "deny"
unused_imports = "deny"
unused_macros = "deny"
unused_must_use = "deny"
unused_mut = "deny"
unused_parens = "deny"
unused_variables = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

################################################################################
